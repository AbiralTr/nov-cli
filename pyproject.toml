[project]
name = "nov-cli"
version = "0.1.0"
description = "A CLI for searching, browsing and reading webnovels in your terminal — inspired by ani-cli."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abiral Tuladhar" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.scripts]
nov = "nov_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
